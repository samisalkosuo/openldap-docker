# slapd.conf template - values substituted at container startup by entrypoint.sh
# This file is converted to cn=config format via: slaptest -f slapd.conf -F /etc/openldap/slapd.d
# Overlays (memberof, refint) are configured separately via overlays.ldif loaded by slapadd.

# Core schema (required)
include         /etc/openldap/schema/core.schema
include         /etc/openldap/schema/cosine.schema
include         /etc/openldap/schema/inetorgperson.schema
include         /etc/openldap/schema/nis.schema

# Modules for overlays (loaded here so slaptest knows about them; configured via overlays.ldif)
modulepath      /usr/lib64/openldap
moduleload      memberof.la
moduleload      refint.la

# Global TLS configuration
TLSCertificateFile      /certs/ldap.crt
TLSCertificateKeyFile   /certs/ldap.key
TLSCACertificateFile    /certs/ca.crt

# Log level (256 = stats)
loglevel        LOGLEVEL_PLACEHOLDER

# MDB backend database
database        mdb
suffix          "LDAP_ROOT_PLACEHOLDER"
rootdn          "cn=admin,LDAP_ROOT_PLACEHOLDER"
rootpw          LDAP_ADMIN_PASSWORD_HASH_PLACEHOLDER

# Database directory - must exist and be writable
directory       /var/lib/openldap/data

# Database size limit (500MB)
maxsize         524288000

# Indices for common searches
index           objectClass     eq
index           uid             eq
index           cn              eq
index           sn              eq
index           mail            eq
index           memberOf        eq
index           uniqueMember    eq

# Disable anonymous binding - all operations require authentication
access to *
    by anonymous    auth
    by self         write
    by users        read
    by *            none
